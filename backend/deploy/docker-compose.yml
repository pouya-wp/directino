# Single German VPS: API + agent, Postgres with pgvector, Caddy for TLS.
services:
  api:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DIRECTINO_ADDR: ":8080"
      DIRECTINO_DB_DRIVER: postgres
      DIRECTINO_DB_DSN: postgres://directino:${POSTGRES_PASSWORD}@db:5432/directino?sslmode=disable
    depends_on: [db]

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: directino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: directino
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  pgdata:
  caddy:
